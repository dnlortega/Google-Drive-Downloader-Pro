name: Build and Release
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pyinstaller customtkinter gdown plyer pystray pillow CTkMessagebox
        if (Test-Path requirements.txt) { pip install -r requirements.txt }
      shell: pwsh

    - name: Run Tests
      run: pytest tests/
      shell: pwsh

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --icon "icon.ico" --name "GoogleDriveDownloaderPro" --add-data "icon.ico;." "app.pyw"
      shell: pwsh

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v3
      with:
        name: GoogleDriveDownloaderPro
        path: dist/GoogleDriveDownloaderPro
